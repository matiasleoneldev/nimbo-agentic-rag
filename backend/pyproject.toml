[project]
name = "chatbot-archivo"
version = "0.1.0"
description = ""
authors = [
    {name = "Matias de la Rosa Sterbanoff",email = "matiasleonel.dev@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "langchain (>=1.4.3,<2.0.0)",
    "langchain-openai (>=1.6.7,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "fastapi (>=0.143.1,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pdfplumber (>=0.11.10,<0.12.0)",
    "langchain-postgres (>=0.0.19,<0.0.20)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "langgraph (>=1.2.11,<1.3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "types-pyyaml (>=6.0.12.20260906,<7.0.0.0)",
    "fpdf2 (>=2.8.9,<3.0.0)"
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
